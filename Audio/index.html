<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio</title>
</head>
<body>
    <h1>Random Sampled Song</h1>
    <hr>
    <audio controls loop>
        <source src="music.mp3" type="audio/mpeg">
        <source src="music.wav" type="audio/wav"> <!--Done if our browser does not support mp3 files-->
    </audio>
</body>
</html>
